<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>虹を描こう</title>
    <style>
        /* 全体のステージ設定 */
        .stage {
            position: relative;
            width: 800px;
            height: 600px;
            background: url('rainbow.jpg.jpg') no-repeat center/contain;
            border: 1px solid #ccc;
            margin: 0 auto;
        }

        /* 虹のSVG配置位置（画像に合わせて微調整可能） */
        .rainbow-svg {
            position: absolute;
            top: 100px;
            left: 160px;
            width: 550px;
            height: 325px;
        }

        /* 虹の線のスタイル */
        .arc {
            fill: none;
            stroke-width: 18;
            stroke: rgba(200, 200, 200, 0.3); /* 灰色の半透明 */
            cursor: pointer;
            transition: stroke 0.3s;
        }

        /* 選択中の段を強調表示するスタイル */
        .arc.selected {
            stroke-dasharray: 4; /* 選択中であることがわかるように点線風にする */
        }

        /* 操作用の透明クリックエリアの共通スタイル */
        .click-area {
            position: absolute;
            cursor: pointer;
            border-radius: 50%;
            /* 位置調整用の赤枠（位置が決まったら border: none; にします） */
            border: 2px dashed red; 
        }

        /* 現在選択中の表示エリア */
        .status-display {
            text-align: center;
            font-size: 18px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="stage">
        <!-- 虹を描くSVG -->
        <svg class="rainbow-svg" viewBox="0 0 400 200">
            <path id="arc-1" class="arc" d="M 20,200 A 180,180 0 0,1 380,200" onclick="selectStep(1)" />
            <path id="arc-2" class="arc" d="M 40,200 A 160,160 0 0,1 360,200" onclick="selectStep(2)" />
            <path id="arc-3" class="arc" d="M 60,200 A 140,140 0 0,1 340,200" onclick="selectStep(3)" />
            <path id="arc-4" class="arc" d="M 80,200 A 120,120 0 0,1 320,200" onclick="selectStep(4)" />
            <path id="arc-5" class="arc" d="M 100,200 A 100,100 0 0,1 300,200" onclick="selectStep(5)" />
            <path id="arc-6" class="arc" d="M 120,200 A 80,80 0 0,1 280,200" onclick="selectStep(6)" />
            <path id="arc-7" class="arc" d="M 140,200 A 60,60 0 0,1 260,200" onclick="selectStep(7)" />
        </svg>

        <!-- 左側の数字ボタン（画像に合わせて配置） -->
        <div class="click-area" style="top:  20px; left: 10px; width: 60px; height: 60px;" onclick="selectStep(1)"></div>
        <div class="click-area" style="top:  90px; left: 10px; width: 60px; height: 60px;" onclick="selectStep(2)"></div>
        <div class="click-area" style="top: 160px; left: 10px; width: 60px; height: 60px;" onclick="selectStep(3)"></div>
        <div class="click-area" style="top: 230px; left: 10px; width: 60px; height: 60px;" onclick="selectStep(4)"></div>
        <div class="click-area" style="top: 300px; left: 10px; width: 60px; height: 60px;" onclick="selectStep(5)"></div>
        <div class="click-area" style="top: 370px; left: 10px; width: 60px; height: 60px;" onclick="selectStep(6)"></div>
        <div class="click-area" style="top: 440px; left: 10px; width: 60px; height: 60px;" onclick="selectStep(7)"></div>

        <!-- 下側のカラーパレットボタン（画像に合わせて配置） -->
        <div class="click-area" style="top: 515px; left: 100px; width: 70px; height: 70px;" onclick="applyColor('#FF0000')"></div> <!-- 赤 -->
        <div class="click-area" style="top: 515px; left: 185px; width: 70px; height: 70px;" onclick="applyColor('#FFA500')"></div> <!-- 橙 -->
        <div class="click-area" style="top: 515px; left: 270px; width: 70px; height: 70px;" onclick="applyColor('#FFFF00')"></div> <!-- 黄 -->
        <div class="click-area" style="top: 515px; left: 355px; width: 70px; height: 70px;" onclick="applyColor('#7CFC00')"></div> <!-- 緑 -->
        <div class="click-area" style="top: 515px; left: 440px; width: 70px; height: 70px;" onclick="applyColor('#87CEEB')"></div> <!-- 水 -->
        <div class="click-area" style="top: 515px; left: 525px; width: 70px; height: 70px;" onclick="applyColor('#0000FF')"></div> <!-- 青 -->
        <div class="click-area" style="top: 515px; left: 610px; width: 70px; height: 70px;" onclick="applyColor('#800080')"></div> <!-- 紫 -->
    </div>

    <!-- 案内表示 -->
    <div id="status" class="status-display">「数字」または「虹の線」を選んでから、「色」を押してね！</div>

    <script>
        // 現在えらばれている段番号（最初は未選択）
        let selectedStep = null;

        // 段を選択する関数
        function selectStep(step) {
            selectedStep = step;
            
            // すべての線の選択状態を解除
            for (let i = 1; i <= 7; i++) {
                document.getElementById('arc-' + i).classList.remove('selected');
            }
            
            // 選んだ線だけ強調表示（点線にする）
            document.getElementById('arc-' + step).classList.add('selected');

            // メッセージ更新
            document.getElementById('status').innerText = step + '段目がえらばれました！下の色を押してね。';
        }

        // 色を塗る関数
        function applyColor(color) {
            if (selectedStep === null) {
                alert('先に左の「数字」または「虹の線」を選んでね！');
                return;
            }

            // 選択中の段に色を塗る
            const targetArc = document.getElementById('arc-' + selectedStep);
            targetArc.style.stroke = color;
            targetArc.classList.remove('selected'); // 強調解除

            document.getElementById('status').innerText = selectedStep + '段目を塗りました！次の数字を選んでね。';
            
            // 次の段へ自動で進むと使いやすい
            if (selectedStep > 1) {
                selectStep(selectedStep - 1);
            } else {
                selectedStep = null;
            }
        }
    </script>

</body>
</html>
